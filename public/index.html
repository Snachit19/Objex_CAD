<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Objex CAD | Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

  <section class="auth-shell">
    <div class="brand-row">
      <div class="logo-circle">O</div>
      <div>
        <h1>Objex CAD</h1>
        <p>Professional Design Studio</p>
      </div>
    </div>

    <div class="auth-card">
      <h2>Quick Login</h2>

      <div class="tabs">
        <button class="active">Sign In</button>
        <button>Register</button>
      </div>

      <form>
        <label>Email</label>
        <input type="email" placeholder="you@example.com">

        <label>Password</label>
        <input type="password" placeholder="••••••••">

        <button type="button" class="primary-btn">Sign In</button>
      </form>

      <p class="note">Authentication will be connected in a later commit.</p>
    </div>
  </section>

</body>
</html>
