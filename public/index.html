<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objex CAD | Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="login-page">

  <section class="login-sidebar">

    <div class="login-brand">
      <div class="brand-logo">
        <img src="/assets/logo.png" alt="Objex CAD Logo">
      </div>

      <div>
        <h1>CAD 3D</h1>
        <p>Professional Design Studio</p>
      </div>
    </div>

    <div class="quick-login-card">
      <h2>Quick Login</h2>

      <form>
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="you@example.com"
        >

        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••"
        >

        <button type="button" class="sign-btn">
          <span>↪</span> Sign In
        </button>
      </form>
    </div>

  </section>

</body>
</html>
