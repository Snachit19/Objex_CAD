<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objex CAD | Register</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="login-page">

  <section class="login-sidebar register-sidebar">

    <div class="login-brand">
      <div class="brand-logo">
        <img src="/assets/logo.png" alt="Objex CAD Logo">
      </div>

      <div>
        <h1>CAD 3D</h1>
        <p>Professional Design Studio</p>
      </div>
    </div>

    <div class="quick-login-card">
      <h2>Create Account</h2>

      <form id="register-form" onsubmit="handleRegister(event)">

        <label for="fullname">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </span>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="John Doe"
            required
          >
        </div>

        <label for="reg-email">Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
          </span>
          <input
            type="email"
            id="reg-email"
            name="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <label for="reg-password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input
            type="password"
            id="reg-password"
            name="password"
            placeholder="••••••••"
            required
          >
          <button type="button" class="toggle-pw" onclick="togglePassword('reg-password', this)" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input
            type="password"
            id="confirm-password"
            name="confirm_password"
            placeholder="••••••••"
            required
          >
          <button type="button" class="toggle-pw" onclick="togglePassword('confirm-password', this)" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div id="error-msg" class="error-msg" style="display:none;"></div>

        <button type="submit" class="sign-btn" id="submit-btn">
          <span>✦</span> Sign Up
        </button>

        <p class="switch-link">Already have an account? <a href="/index.html">Sign In</a></p>

      </form>
    </div>

  </section>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.style.opacity = isText ? '0.5' : '1';
    }

    function handleRegister(e) {
      e.preventDefault();
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('submit-btn');
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('confirm-password').value;

      errorEl.style.display = 'none';

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.style.display = 'block';
        return;
      }

      // Loading state
      btn.textContent = 'Creating account…';
      btn.disabled = true;

      // TODO: Replace with real API call
      setTimeout(() => {
        btn.textContent = '✦ Sign Up';
        btn.disabled = false;
        // Redirect after success:
        // window.location.href = '/dashboard.html';
      }, 1500);
    }
  </script>

</body>
</html>
