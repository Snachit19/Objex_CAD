<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objex CAD | Workspace</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="cad-page">

  <header class="cad-topbar">
    <div>
      <h2 id="cadProjectName">Objex CAD Workspace</h2>
      <p id="cadProjectDescription">3D Design Editor</p>
    </div>

    <div class="cad-actions">
      <a href="/dashboard" class="back-dashboard-btn">← Dashboard</a>
      <button id="saveDesignBtn" class="save-btn">Save Design</button>
    </div>
  </header>

<nav class="cad-toolbar">
  <div class="shape-menu-wrapper">

    <button id="addShapeBtn" class="add-shape-icon-btn" title="Add Shape" aria-label="Add Shape">
      <img src="/static/assets/add-shape.svg" alt="Add Shape">
      <span>▾</span>
    </button>

    <div id="shapeMenuOptions" class="shape-menu-options">
      <button type="button" data-shape="cube">⬛ Cube</button>
      <button type="button" data-shape="sphere">⚪ Sphere</button>
      <button type="button" data-shape="cylinder">▰ Cylinder</button>
      <button type="button" data-shape="cone">🔺 Cone</button>
      <button type="button" data-shape="torus">⭕ Torus</button>
      <button type="button" data-shape="pyramid">△ Pyramid</button>
      <button type="button" data-shape="plane">▬ Plane</button>
    </div>

  </div>
</nav>

  <main class="cad-workspace">
    <section class="cad-canvas-area">
      <canvas id="cadCanvas"></canvas>
      <div id="shapeTooltip"></div>
    </section>

    <aside class="cad-inspector">
      <h3>Project Details</h3>

      <p><strong>Name:</strong> <span id="projectNameText">Loading...</span></p>
      <p><strong>Description:</strong> <span id="projectDescriptionText">Loading...</span></p>
      <p><strong>Status:</strong> <span id="cadStatusText">Opening saved project...</span></p>
      <p><strong>Tip:</strong> Hover a shape to see its dimensions. Drag to orbit. Scroll to zoom.</p>

      <div class="selected-object-panel">
      <h3>Selected Object</h3>

      <p><strong>Name:</strong> <span id="selectedObjectName">None</span></p>
      <p><strong>Type:</strong> <span id="selectedObjectType">None</span></p>
      <p><strong>Position:</strong> <span id="selectedObjectPosition">None</span></p>
        <p><strong>Scale:</strong> <span id="selectedObjectScale">None</span></p>
      </div>
    </aside>
    
  </main>

 <script>
  window.PROJECT_ID = Number("{{ project_id }}");
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="/static/js/cad/loadProject.js"></script>
<script src="/static/js/cad/sceneSetup.js"></script>
<script src="/static/js/cad/addShape.js"></script>
<script src="/static/js/cad/selectObject.js"></script>
<script src="/static/js/cad/saveDesign.js"></script>
</body>
</html>
