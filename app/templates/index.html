{% extends "base.html" %}
{% block title %}Objex CAD | Login{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block maincontent %}
<section class="login-sidebar">
 
    <div class="login-brand">
      <div class="brand-logo">
        <img src="/static/images/logo.png" alt="Objex CAD Logo">
      </div>
 
      <div>
        <h1>CAD 3D</h1>
        <p>Professional Design Studio</p>
      </div>
    </div>
 
    <div class="quick-login-card">
      <h2>Quick Login</h2>
 
      <div id="msg-box" style="
        display: none;
        margin-bottom: 18px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
      "></div>
 
      <form>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        >
 
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        >
 
        <button type="button" class="sign-btn" id="login-btn">
          <span>↪</span> Sign In
        </button>
        <p class="switch-link">Don't have an account? <a href="/register">Create Account</a></p>
      </form>
    </div>
 
  </section>
 
  <script>
  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("login-btn");
    const msgBox = document.getElementById("msg-box");

    msgBox.style.display = "none";

    if (!email || !password) {
      showMsg("Please enter your email and password.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      });

      const data = await response.json();

      if (response.ok && data.success) {
        showMsg("Login successful. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "/dashboard";
        }, 800);
      } else {
        showMsg(data.message || "Login failed.", "error");
        btn.disabled = false;
        btn.innerHTML = "<span>↪</span> Sign In";
      }

    } catch (err) {
      showMsg("Cannot reach the server. Is Flask running?", "error");
      btn.disabled = false;
      btn.innerHTML = "<span>↪</span> Sign In";
    }
  });

  function showMsg(text, type) {
    const box = document.getElementById("msg-box");
    box.textContent = text;
    box.style.display = "block";
    if (type === "error") {
      box.style.background = "rgba(239,68,68,0.15)";
      box.style.border     = "1px solid rgba(239,68,68,0.4)";
      box.style.color      = "#f87171";
    } else {
      box.style.background = "rgba(34,197,94,0.15)";
      box.style.border     = "1px solid rgba(34,197,94,0.4)";
      box.style.color      = "#4ade80";
    }
  }
</script>
{% endblock %}
